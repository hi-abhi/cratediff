name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_COLOR: "true"
  TRUNK_VERSION: "0.21.14"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          cargo test --locked
          npm test

      - name: Install Trunk
        run: cargo install trunk --version "$TRUNK_VERSION" --locked

      - name: Build the static site
        run: trunk build --release --locked --public-url /

      - name: Prepare client-side routing
        run: cp dist/index.html dist/404.html

      - name: Report WebAssembly size
        run: npm run size:wasm

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
