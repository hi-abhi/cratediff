[package]
name = "crate-diff"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1"
futures = "0.3"
gloo-net = "0.7"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tar = { version = "0.4", default-features = false }
urlencoding = "2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DomRect", "Storage"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
